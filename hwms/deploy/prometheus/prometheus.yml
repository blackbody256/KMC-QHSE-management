# Prometheus scrape configuration.
#
# Services expose route-templated request metrics. No metric label carries a
# patient, encounter or incident identifier. Separately from the privacy rule,
# unbounded label cardinality would destroy this database, so the two concerns
# point the same way.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: hwms

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8081"]
        labels:
          service: gateway

  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ["identity:8082"]
        labels:
          service: identity

  - job_name: clinical
    metrics_path: /metrics
    static_configs:
      - targets: ["clinical:8083"]
        labels:
          service: clinical

  - job_name: admin
    metrics_path: /metrics
    static_configs:
      - targets: ["admin:8084"]
        labels:
          service: admin

  - job_name: occupational
    metrics_path: /metrics
    static_configs:
      - targets: ["occupational:8085"]
        labels:
          service: occupational

  - job_name: metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics:8086"]
        labels:
          service: metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
