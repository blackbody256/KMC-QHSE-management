apiVersion: v1
kind: Service
metadata:
  name: metrics
  namespace: hwms
spec:
  type: ClusterIP
  selector: { app: metrics }
  ports:
    - port: 8086
      targetPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: hwms
spec:
  replicas: 2
  selector:
    matchLabels: { app: metrics }
  template:
    metadata:
      labels: { app: metrics }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: metrics
          image: ghcr.io/kiiramotors/hwms-metrics:latest
          env:
            - name: METRICS_ADDR
              value: ":8086"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: POSTGRES_PASSWORD }
            - name: METRICS_DATABASE_URL
              value: postgres://hwms:$(POSTGRES_PASSWORD)@postgres:5432/metrics?sslmode=disable
            # This is the only secret metrics shares with clinical. Metrics is
            # never issued the clinical database password or connection URL.
            - name: METRICS_INGEST_TOKEN
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: METRICS_INGEST_TOKEN }
          envFrom:
            - configMapRef: { name: hwms-config }
          ports:
            - containerPort: 8086
          livenessProbe:
            httpGet: { path: /livez, port: 8086 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8086 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Only the clinical service may open a connection to the clinical database.
# This is ADR-03 expressed at the network layer: even with the credentials, no
# other pod in the namespace can reach the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clinical-database-isolation
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: postgres-clinical }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: clinical }
      ports:
        - protocol: TCP
          port: 5432
---
# The shared database accepts only the workloads that own a database on it.
# Clinical is deliberately absent because it uses its isolated instance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shared-database-clients
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [keycloak, identity, admin, occupational, metrics]
      ports:
        - protocol: TCP
          port: 5432
---
# Browser traffic terminates at web or Keycloak. The other services remain
# reachable only from the named in-cluster callers below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-edge-services
  namespace: hwms
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [web, keycloak]
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-web
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: web }
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-from-gateway
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: identity }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clinical-from-gateway
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: clinical }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - protocol: TCP
          port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-service-clients
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: admin }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [gateway, occupational, metrics]
      ports:
        - protocol: TCP
          port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occupational-service-clients
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: occupational }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [gateway, metrics]
      ports:
        - protocol: TCP
          port: 8085
---
# Clinical can deliver the four-field leave contribution, and the gateway can
# reach the authenticated metrics API. No ingress path targets this service,
# so /internal is not reachable from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-service-clients
  namespace: hwms
spec:
  podSelector:
    matchLabels: { app: metrics }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [gateway, clinical]
      ports:
        - protocol: TCP
          port: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hwms
spec:
  selector: { app: web }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hwms
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/kiiramotors/hwms-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
# TLS terminates here, satisfying NFR-SEC-01. The certificate is issued by
# whatever KMC ICT uses internally; cert-manager is assumed but not required.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hwms
  namespace: hwms
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["qhse.kiiramotors.local"]
      secretName: hwms-tls
  rules:
    - host: qhse.kiiramotors.local
      http:
        paths:
          # Keycloak is served under /idp on the same host, so that the issuer
          # the browser sees and the address the cluster resolves are one
          # hostname. This is the production form of the /etc/hosts step the
          # Compose stack asks a developer to take. /auth belongs to the
          # gateway and is not shared.
          - path: /idp
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8180 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 8080 } } }
