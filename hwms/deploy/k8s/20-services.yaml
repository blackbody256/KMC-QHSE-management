apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hwms
spec:
  selector: { app: gateway }
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hwms
spec:
  # One replica until the session store is shared. The in-memory store in
  # services/gateway/session.go is single-instance by construction: two
  # replicas would not share sessions and users would appear to be signed out
  # at random. Replace the store before raising this number.
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: gateway
          image: ghcr.io/kiiramotors/hwms-gateway:latest
          env:
            - name: GATEWAY_ADDR
              value: ":8081"
            - name: OIDC_CLIENT_ID
              value: hwms-gateway
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: GATEWAY_CLIENT_SECRET }
            - name: OIDC_REDIRECT_URL
              value: https://qhse.kiiramotors.local/auth/callback
          envFrom:
            - configMapRef: { name: hwms-config }
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet: { path: /livez, port: 8081 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: hwms
spec:
  selector: { app: identity }
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: hwms
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity }
  template:
    metadata:
      labels: { app: identity }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: identity
          image: ghcr.io/kiiramotors/hwms-identity:latest
          env:
            - name: IDENTITY_ADDR
              value: ":8082"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: hwms-identity
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: IDENTITY_CLIENT_SECRET }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgres://hwms:$(POSTGRES_PASSWORD)@postgres:5432/identity?sslmode=disable
          envFrom:
            - configMapRef: { name: hwms-config }
          ports:
            - containerPort: 8082
          livenessProbe:
            httpGet: { path: /livez, port: 8082 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: clinical
  namespace: hwms
spec:
  selector: { app: clinical }
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical
  namespace: hwms
spec:
  replicas: 2
  selector:
    matchLabels: { app: clinical }
  template:
    metadata:
      labels: { app: clinical }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: clinical
          image: ghcr.io/kiiramotors/hwms-clinical:latest
          env:
            - name: CLINICAL_ADDR
              value: ":8083"
            - name: CLINICAL_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: CLINICAL_DB_PASSWORD }
            # The only workload issued these credentials. No other deployment
            # in this namespace references CLINICAL_DB_PASSWORD, and a review
            # that finds a second one has found a defect.
            - name: CLINICAL_DATABASE_URL
              value: postgres://hwms_clinical:$(CLINICAL_DB_PASSWORD)@postgres-clinical:5432/clinical?sslmode=require
            - name: METRICS_INGEST_TOKEN
              valueFrom:
                secretKeyRef: { name: hwms-secrets, key: METRICS_INGEST_TOKEN }
          envFrom:
            - configMapRef: { name: hwms-config }
          ports:
            - containerPort: 8083
          livenessProbe:
            httpGet: { path: /livez, port: 8083 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
