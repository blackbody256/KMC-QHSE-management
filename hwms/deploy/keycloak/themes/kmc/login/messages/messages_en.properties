# Message overrides for the KMC login theme.
#
# Two house rules drive every line below, and both are inherited from the
# application rather than invented here.
#
# Sentence case throughout, including buttons. Keycloak's stock bundle is title
# case, "Sign In", "New Password", which is the one visible way this page
# would still read as a different product after all the styling work.
#
# An error states the corrective action rather than only reporting failure.
# "Invalid password: minimum length 12" tells a user what went wrong; it does
# not tell them what to do, and the difference is a support call.
#
# Anything not overridden falls through to the parent theme's bundle.

# --- actions ---------------------------------------------------------------
doLogIn=Sign in
doSubmit=Continue
doCancel=Cancel
doTryAnotherWay=Try another way to sign in

# --- field labels ----------------------------------------------------------
username=Username
usernameOrEmail=Username or email address
email=Email address
password=Password
passwordNew=New password
passwordConfirm=Confirm new password
rememberMe=Stay signed in
logoutOtherSessions=Sign this account out on other devices

# --- titles ----------------------------------------------------------------
loginTitle=Sign in to {0}
errorTitle=Sign-in could not be completed
pageExpiredTitle=The sign-in attempt expired

# --- credential failures ---------------------------------------------------
# Deliberately identical for an unknown account and a wrong password. Two
# different messages here would turn this page into a way of finding out which
# email addresses hold accounts.
invalidUserMessage=That email address and password combination was not recognised. Check the address you were issued, and try again.
missingUsernameMessage=Enter the email address your account was created with.
missingPasswordMessage=Enter your password.
accountDisabledMessage=This account has been disabled. Ask the Health and Wellness manager to enable it.
accountTemporarilyDisabledMessage=Too many failed attempts, so sign-in is locked for fifteen minutes. Wait, then try again, or ask the Health and Wellness manager to reset the password if you no longer have it.

# --- password policy -------------------------------------------------------
# The realm policy is length(12) and digits(1) and notUsername and notEmail.
# These lines and that policy must be changed together.
invalidPasswordMinLengthMessage=That password is too short. Use at least {0} characters.
invalidPasswordMinDigitsMessage=That password needs at least {0} digit. Add a number anywhere in it.
invalidPasswordNotUsernameMessage=That password is the same as your username. Choose something unrelated to your account name.
invalidPasswordNotEmailMessage=That password is the same as your email address. Choose something unrelated to your account name.
invalidPasswordHistoryMessage=That password has been used on this account before. Choose one you have not used.
notMatchPasswordMessage=The two passwords do not match. Type the new password again in both boxes.
