# The KMC sign-in theme.
#
# Keycloak owns password policy, lockout and, later, corporate single sign-on,
# so the browser genuinely leaves the application to sign in. Without this theme
# it leaves a branded workspace for a stock Keycloak page and comes back, which
# reads to a user as having been handed to a different system entirely.
#
# parent=keycloak is kept for the message bundles and for any template not
# overridden here. The layout does not depend on the parent's markup: template.ftl
# below defines the whole page, so a Keycloak upgrade that restyles the stock
# login theme cannot silently restyle this one.
parent=keycloak
import=common/keycloak

# Replaces the parent's stylesheet list rather than adding to it.
styles=css/kmc.css

meta=viewport==width=device-width,initial-scale=1
