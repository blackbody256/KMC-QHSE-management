<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect x="560" y="40" width="480" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="92.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">Failure detected</text><line x1="800" y1="130" x2="800" y2="200" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="560" y="200" width="480" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="252.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Is the database intact?</text><line x1="560" y1="245" x2="380" y2="245" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="225" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">No</text><rect x="60" y="200" width="300" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="210" y="236.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Runbook C</text><text x="210" y="268.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">restore database</text><line x1="800" y1="290" x2="800" y2="360" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="820" y="335" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">Yes</text><rect x="560" y="360" width="480" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="412.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Is the host reachable?</text><line x1="560" y1="405" x2="380" y2="405" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="400" y="385" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">No</text><rect x="60" y="360" width="300" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="210" y="396.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Runbook D</text><text x="210" y="428.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">full recovery</text><line x1="800" y1="450" x2="800" y2="520" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="820" y="495" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">Yes</text><rect x="560" y="520" width="480" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="572.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Did a deployment precede it?</text><line x1="1040" y1="565" x2="1240" y2="565" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="1090" y="545" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">Yes</text><rect x="1260" y="520" width="300" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1410" y="556.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Runbook B</text><text x="1410" y="588.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">roll back</text><line x1="800" y1="610" x2="800" y2="680" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="820" y="655" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">No</text><rect x="560" y="680" width="480" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="732.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Which component failed?</text><line x1="560" y1="725" x2="380" y2="725" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="680" width="300" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="210" y="716.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Runbook A</text><text x="210" y="748.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">single service</text><line x1="1040" y1="725" x2="1240" y2="725" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="1260" y="680" width="300" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1410" y="716.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Runbooks E and F</text><text x="1410" y="748.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">backbone or graph</text><text x="20" y="860" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start" font-style="italic">Runbook G applies independently whenever a secret is known or suspected to be exposed</text></svg>