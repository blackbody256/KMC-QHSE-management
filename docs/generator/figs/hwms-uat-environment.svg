<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="700" fill="#FFFFFF"/><rect x="40" y="50" width="720" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="70" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="start" font-weight="bold">User testing environment</text><rect x="90" y="130" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="400" y="167.4" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">KMC controlled host</text><text x="400" y="196.4" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">reachable on the plant network only</text><rect x="90" y="250" width="620" height="90" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="400" y="301.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Synthetic patients, visits and requisitions</text><rect x="90" y="370" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="400" y="421.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Named test participants only</text><rect x="90" y="490" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="400" y="541.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Data destroyed at the end of testing</text><rect x="840" y="50" width="720" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="870" y="95" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="start" font-weight="bold">Production, not yet requested</text><rect x="890" y="130" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="1200" y="181.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Hosting decided by ICT after review</text><rect x="890" y="250" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="1200" y="301.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Real clinical records</text><rect x="890" y="370" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="1200" y="421.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Retention and backup policy approved first</text><rect x="890" y="490" width="620" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="1200" y="541.9" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Named owners appointed first</text><text x="800" y="350" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">No</text><text x="800" y="385" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">copy</text><text x="20" y="685" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start" font-style="italic">Nothing crosses from the left to the right without the approvals named in this document</text></svg>