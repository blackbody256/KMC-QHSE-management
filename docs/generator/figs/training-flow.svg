<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="560" fill="#FFFFFF"/><rect x="40" y="70" width="300" height="110" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="190" y="116.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Access requested</text><text x="190" y="148.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">by line manager</text><line x1="340" y1="125" x2="420" y2="125" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="70" width="300" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="570" y="116.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Common module</text><text x="570" y="148.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">delivered</text><line x1="720" y1="125" x2="800" y2="125" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="800" y="70" width="300" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="950" y="116.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Role module</text><text x="950" y="148.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">delivered</text><line x1="1100" y1="125" x2="1180" y2="125" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="1180" y="70" width="360" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="1360" y="116.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#00000