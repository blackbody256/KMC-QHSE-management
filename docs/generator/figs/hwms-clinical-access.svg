<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="820" fill="#FFFFFF"/><rect x="420" y="40" width="760" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="92.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">A request for an individual clinical record</text><line x1="800" y1="130" x2="800" y2="180" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="180" width="1000" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="221.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">1. Identity provider</text><text x="800" y="253.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">only the officer role carries the clinical role</text><line x1="800" y1="280" x2="800" y2="320" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="320" width="1000" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="361.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">2. Route table</text><text x="800" y="393.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">clinical routes are not offered to any other role</text><line x1="800" y1="420" x2="800" y2="460" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="460" width="1000" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="501.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">3. Service</text><text x="800" y="533.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">checked in the handler, then again in the service layer</text><line x1="800" y1="560" x2="800" y2="600" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="600" width="1000" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="641.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">4. Deployment</text><text x="800" y="673.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">only this service holds the clinical database credential</text><line x1="300" y1="650" x2="180" y2="650" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="600" width="140" height="100" fill="#BFBFBF" stroke="#000000" stroke-width="3" rx="6"/><text x="110" y="657.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Refused</text><text x="1330" y="230" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">Any layer</text><text x="1330" y="265" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">may refuse</text><text x="1330" y="300" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start">on its own</text><line x1="800" y1="700" x2="800" y2="740" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="420" y="740" width="760" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="782.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle" font-weight="bold">Record returned, and the retrieval written to the access log first</text></svg>