<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <text x="20" y="35" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" font-weight="bold">Client</text>
  <rect x="500" y="50" width="600" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="800" y="84" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Browser</text>
  <text x="800" y="114" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle">opaque session cookie, never a token</text>

  <text x="20" y="180" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" font-weight="bold">Edge</text>
  <rect x="180" y="200" width="500" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="430" y="238" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Web origin</text>
  <text x="430" y="270" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle">serves the interface and proxies the browser</text>
  <rect x="900" y="200" width="500" height="95" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="1150" y="238" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle" font-weight="bold">Gateway, service 1 of 6</text>
  <text x="1150" y="270" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle">OIDC exchange, server-side session and routing</text>
  <line x1="800" y1="130" x2="430" y2="200" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="680" y1="247" x2="900" y2="247" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>

  <text x="20" y="380" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" font-weight="bold">Application services</text>
  <line x1="1150" y1="295" x2="1150" y2="345" stroke="#000000" stroke-width="3"/>
  <line x1="175" y1="345" x2="1415" y2="345" stroke="#000000" stroke-width="3"/>

  <rect x="30" y="400" width="290" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="175" y="438" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle" font-weight="bold">Identity, service 2 of 6</text>
  <text x="175" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">account administration</text>
  <text x="175" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">administrative audit trail</text>

  <rect x="340" y="400" width="290" height="120" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="485" y="438" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle" font-weight="bold">Clinical, service 3 of 6</text>
  <text x="485" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">patients, visits, lab, referrals</text>
  <text x="485" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">sole clinical credential holder</text>

  <rect x="650" y="400" width="290" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="795" y="438" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle" font-weight="bold">Admin, service 4 of 6</text>
  <text x="795" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">dated KPI targets</text>
  <text x="795" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">and exposure limits</text>

  <rect x="960" y="400" width="290" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="1105" y="438" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle" font-weight="bold">Occupational, service 5 of 6</text>
  <text x="1105" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">ergonomics</text>
  <text x="1105" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">and industrial hygiene</text>

  <rect x="1270" y="400" width="290" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="1415" y="438" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle" font-weight="bold">Metrics, service 6 of 6</text>
  <text x="1415" y="470" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">monthly returns</text>
  <text x="1415" y="500" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">nine-indicator dashboard</text>

  <line x1="175" y1="345" x2="175" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="485" y1="345" x2="485" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="795" y1="345" x2="795" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1105" y1="345" x2="1105" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1415" y1="345" x2="1415" y2="400" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>

  <line x1="630" y1="565" x2="1270" y2="565" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <text x="950" y="552" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">Referral identifier, feedback version, month and days</text>

  <rect x="30" y="610" width="290" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/>
  <text x="175" y="649" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="middle">Keycloak</text>
  <text x="175" y="681" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">KMC theme, roles and passwords</text>
  <line x1="175" y1="520" x2="175" y2="610" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>

  <text x="20" y="800" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" font-weight="bold">Data</text>
  <rect x="30" y="820" width="940" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="500" y="858" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Shared PostgreSQL instance</text>
  <text x="500" y="892" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">Keycloak, identity, admin, occupational and metrics databases</text>
  <text x="500" y="924" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">one database per stateful owner</text>

  <rect x="1040" y="820" width="520" height="130" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/>
  <text x="1300" y="858" font-family="Times New Roman, Liberation Serif, serif" font-size="23" fill="#000000" text-anchor="middle">Separate PostgreSQL instance</text>
  <text x="1300" y="892" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">clinical database</text>
  <text x="1300" y="924" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" text-anchor="middle">separate credentials and key</text>

  <polyline points="485,520 485,760 1300,760 1300,820" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/>
  <text x="20" y="985" font-family="Times New Roman, Liberation Serif, serif" font-size="21" fill="#000000" font-style="italic">Metrics holds no clinical database credential. Only the four-field leave fact crosses the clinical boundary.</text>
</svg>
