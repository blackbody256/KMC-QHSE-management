<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="880" fill="#FFFFFF"/><text x="20" y="40" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start" font-weight="bold">Client</text><rect x="480" y="60" width="640" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="96.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Browser</text><text x="800" y="128.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">holds an opaque session cookie, never a token</text><line x1="800" y1="150" x2="800" y2="215" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="205" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start" font-weight="bold">Edge</text><rect x="200" y="230" width="1200" height="110" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="800" y="276.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">Web origin and gateway</text><text x="800" y="308.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle" font-weight="bold">completes the sign in exchange, holds tokens server side, proxies the interface</text><text x="20" y="395" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start" font-weight="bold">Services</text><rect x="80" y="415" width="380" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="270" y="450.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">Keycloak</text><text x="270" y="482.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">identity provider</text><text x="270" y="514.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">roles and password policy</text><rect x="560" y="415" width="380" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="750" y="450.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">identity-service</text><text x="750" y="482.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">account administration</text><text x="750" y="514.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">audit trail</text><rect x="1040" y="415" width="460" height="120" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1270" y="450.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">clinical-service</text><text x="1270" y="482.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">patients, visits, laboratory</text><text x="1270" y="514.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">sole holder of clinical credentials</text><line x1="600" y1="340" x2="380" y2="415" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><line x1="760" y1="340" x2="740" y2="415" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><line x1="1000" y1="340" x2="1220" y2="415" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="620" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start" font-weight="bold">Data</text><rect x="80" y="640" width="860" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="510" y="680.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">PostgreSQL</text><text x="510" y="712.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">keycloak and identity databases</text><text x="510" y="744.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">one database and one role per service</text><rect x="1040" y="640" width="460" height="130" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1270" y="680.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">PostgreSQL, separate instance</text><text x="1270" y="712.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">clinical database</text><text x="1270" y="744.8" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="middle">separate credentials and key</text><line x1="280" y1="535" x2="280" y2="640" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><line x1="740" y1="535" x2="600" y2="640" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><line x1="1270" y1="535" x2="1270" y2="640" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="830" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start" font-style="italic">The clinical database is a separate instance. No other service holds a credential for it</text></svg>