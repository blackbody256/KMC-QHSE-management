<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000000"/></marker></defs><rect width="1600" height="760" fill="#FFFFFF"/><rect x="40" y="60" width="1520" height="640" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="60" y="100" font-family="Times New Roman, Liberation Serif, serif" font-size="26" fill="#000000" text-anchor="start" font-weight="bold">Deployment boundary</text><rect x="90" y="140" width="420" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="300" y="182.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Untrusted zone</text><text x="300" y="212.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">operator browser, driver device</text><text x="560" y="175" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="start" font-weight="bold">Boundary 1</text><text x="560" y="210" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">bearer token validated,</text><text x="560" y="240" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">role checked per route</text><line x1="510" y1="190" x2="1060" y2="190" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><rect x="1080" y="140" width="420" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1290" y="182.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">API gateway</text><text x="1290" y="212.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">trusted issuer of identity</text><line x1="1290" y1="240" x2="1290" y2="330" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="1330" y="295" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">Boundary 2, identity headers stripped</text><text x="1330" y="325" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">and reissued, internal secret required</text><rect x="1080" y="330" width="420" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="6"/><text x="1290" y="372.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Domain services</text><text x="1290" y="402.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">no local authorisation</text><line x1="1290" y1="430" x2="1290" y2="520" stroke="#000000" stroke-width="3" marker-end="url(#ah)"/><text x="1330" y="485" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">Boundary 3, one least privilege</text><text x="1330" y="515" font-family="Times New Roman, Liberation Serif, serif" font-size="22" fill="#000000" text-anchor="start">database role per service</text><rect x="1080" y="520" width="420" height="100" fill="#E4E4E4" stroke="#000000" stroke-width="3" rx="6"/><text x="1290" y="562.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Databases</text><text x="1290" y="592.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">no cross schema access</text><rect x="90" y="330" width="420" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="300" y="372.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">Juza charger platform</text><text x="300" y="402.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">long lived interface key</text><rect x="90" y="520" width="420" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" rx="6"/><text x="300" y="562.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">OSRM routing engine</text><text x="300" y="592.2" font-family="Times New Roman, Liberation Serif, serif" font-size="24" fill="#000000" text-anchor="middle">not exposed to the host</text><line x1="1080" y1="380" x2="512" y2="380" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/><line x1="1080" y1="570" x2="512" y2="570" stroke="#000000" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/></svg>